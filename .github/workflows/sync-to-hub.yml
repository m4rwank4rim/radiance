name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: hf-space-sync
      cancel-in-progress: true
    steps:
      - name: Check HF_SPACE_ID
        run: |
          if [ -z "${{ vars.HF_SPACE_ID }}" ]; then
            echo "::error::Repository variable HF_SPACE_ID is missing. Set it to your Space id, e.g. youruser/radiance (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ vars.HF_SPACE_ID }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker
